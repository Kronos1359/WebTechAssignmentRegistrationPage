<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>

    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Please fill in the details below to register.</p>
    <form>
        <!-- Personal Details -->
         <fieldset>
            <legend>Personal Details</legend>
            <!-- Our fields go here -->
            <label for="firstname">First Name:</label>
            <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="Enter your first name"
                required
            >
            <label for="middlename">Middle Name:</label>
            <input
                type="text"
                id="middlename"
                name="middlename"
                minlength="2"
                maxlength="30"
                placeholder="Enter your middle name"
            >
            <label for="lastname">Last Name:</label>
            <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Enter your last name"
                required
            >
            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob"
                required
            >
            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <input type="radio" id="prefernottosay" name="gender" value="Prefer not to say">
            <label for="prefernottosay">Prefer not to say</label>
            <label for="age">Age:</label>
            <input 
                type="number" 
                id="age" 
                name="age"
                min="0"
                max="120"
                placeholder="0-120"
            >
            <label for="nationality">Nationality:</label>
            <input
                type="text"
                id="nationality"
                name="nationality"
                placeholder="What nation are you a citizen of?"
            >
            <label for="bloodgroup">Blood Group:</label>
            <select name="bloodgroup" id="bloodgroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </fieldset>
        <!-- Contact Details -->
        <fieldset>
            <legend>Contact Details</legend>
            <label for="email">Email:</label>
            <input 
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >
            <label for="mobilenumber">Mobile number:</label>
            <input
                type="tel"
                id="mobilenumber"
                name="mobilenumber"
                pattern="[6-9][0-9]{9}"
                maxlength="10"
                placeholder="Enter 10 digit mobile number"
                required
            >
            <label for="alternatenumber">Alternate number:</label>
            <input type="tel"
                id="alternatenumber"
                name="alternatenumber"
                pattern="[6-9][0-9]{9}"
                maxlength="10"
                placeholder="Enter 10 digit mobile number"
            >
            <label for="emergencycontactname">Emergency contact name:</label>
            <input type="text"
                id="emergencycontactname"
                name="emergencycontactname"
                placeholder="Enter emergency contact name"
            >
            <label for="emergencycontactnumber">Emergency contact number:</label>
            <input type="tel" id="emergencycontactnumber"
                name="emergencycontactnumber" pattern="[6-9][0-9]{9}"
                maxlength="10" placeholder="Enter 10 digit mobile number">
        </fieldset>
        
        <!-- Address Details -->
        <fieldset>
            <legend>Address Details</legend>

            <label for="housenumber">House/Door Number:</label>
            <input type="text" id="housenumber" name="housenumber" required>

            <label for="street">Street/Locality:</label>
            <input type="text" id="street" name="street" required>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>

            <label for="state">State:</label>
            <input type="text" id="state" name="state" required>

            <label for="pincode">PIN Code:</label>
            <input type="text" id="pincode" name="pincode"
                pattern="[0-9]{6}" maxlength="6" required>

            <label for="country">Country:</label>
            <input type="text" id="country" name="country"
                value="India" required>

            <p>Address Type:</p>

            <input type="radio" id="residential" name="addresstype"
                value="Residential">
            <label for="residential">Residential</label>

            <input type="radio" id="permanent" name="addresstype"
                value="Permanent">
            <label for="permanent">Permanent</label>

            <input type="radio" id="hostel" name="addresstype"
                value="Hostel">
            <label for="hostel">Hostel</label>

            <br>

            <input type="checkbox" id="sameaddress" name="sameaddress">
            <label for="sameaddress">
                Permanent address is same as current address
            </label>

        </fieldset>

        <!-- Academic Details -->
        <fieldset>
            <legend>Academic Details</legend>

            <label for="college">College Name:</label>
            <input type="text" id="college" name="college" required>

            <label for="university">University:</label>
            <input type="text" id="university" name="university" required>

            <label for="usn">USN / Registration Number:</label>
            <input type="text" id="usn" name="usn" required>

            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="BE">B.E.</option>
                <option value="BTech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="BSc">B.Sc.</option>
                <option value="MCA">MCA</option>
                <option value="MTech">M.Tech</option>
            </select>

            <label for="branch">Branch:</label>
            <select id="branch" name="branch" required>
                <option value="">Select Branch</option>
                <option value="CSE">Computer Science</option>
                <option value="ISE">Information Science</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical</option>
                <option value="ME">Mechanical</option>
                <option value="CV">Civil</option>
            </select>

            <label for="semester">Current Semester:</label>
            <select id="semester" name="semester" required>
                <option value="">Select Semester</option>
                <option value="1">1st</option>
                <option value="2">2nd</option>
                <option value="3">3rd</option>
                <option value="4">4th</option>
                <option value="5">5th</option>
                <option value="6">6th</option>
                <option value="7">7th</option>
                <option value="8">8th</option>
            </select>

            <label for="admissionyear">Admission Year:</label>
            <input type="number" id="admissionyear"
                name="admissionyear" min="2000" max="2030" required>

            <label for="graduationyear">Expected Graduation Year:</label>
            <input type="number" id="graduationyear"
                name="graduationyear" min="2000" max="2040" required>

            <label for="cgpa">Current CGPA:</label>
            <input type="number" id="cgpa" name="cgpa"
                min="0" max="10" step="0.01" required>

            <label for="qualification">Previous Qualification:</label>
            <select id="qualification" name="qualification" required>
                <option value="">Select Qualification</option>
                <option value="PUC">PUC / 12th</option>
                <option value="Diploma">Diploma</option>
                <option value="Other">Other</option>
            </select>

        </fieldset>


        <!-- Account Details -->
        <fieldset>
            <legend>Account Details</legend>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
                minlength="4" maxlength="20" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                minlength="8" required>

            <label for="confirmpassword">Confirm Password:</label>
            <input type="password" id="confirmpassword"
                name="confirmpassword" minlength="8" required>

        </fieldset>

        
        <!-- Additional Information -->
        <fieldset>
            <legend>Additional Information</legend>

            <label for="photo">Upload Profile Photo:</label>
            <input type="file" id="photo" name="photo"
                accept="image/*">

            <p>Hobbies:</p>

            <input type="checkbox" id="reading" name="hobbies"
                value="Reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="sports" name="hobbies"
                value="Sports">
            <label for="sports">Sports</label>

            <input type="checkbox" id="music" name="hobbies"
                value="Music">
            <label for="music">Music</label>

            <input type="checkbox" id="coding" name="hobbies"
                value="Coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="travel" name="hobbies"
                value="Travel">
            <label for="travel">Travel</label>

            <br>

            <label for="skills">Skills:</label>
            <textarea id="skills" name="skills"
                    rows="4" cols="40"
                    placeholder="Describe your skills..."></textarea>

            <label for="bio">Short Bio:</label>
            <textarea id="bio" name="bio"
                    rows="5" cols="40"
                    placeholder="Tell us something about yourself..."></textarea>

        </fieldset>

        
        <!-- Preferences -->
        <fieldset>
            <legend>Preferences and Declaration</legend>

            <label for="communication">Preferred Mode of Communication:</label>

            <select id="communication" name="communication" required>
                <option value="">Select Preference</option>
                <option value="Email">Email</option>
                <option value="SMS">SMS</option>
                <option value="Phone">Phone Call</option>
            </select>

            <br>

            <input type="checkbox" id="newsletter" name="newsletter"
                value="Yes">
            <label for="newsletter">
                Subscribe to our newsletter
            </label>

            <br>

            <input type="checkbox" id="terms" name="terms"
                value="Accepted" required>
            <label for="terms">
                I agree to the Terms and Conditions
            </label>

        </fieldset>

        <br>

        <!-- Form Buttons -->
        <button type="submit">Register</button>
        <button type="reset">Reset Form</button>


    </form>

    <script>


    </script>
</body>
</html>
